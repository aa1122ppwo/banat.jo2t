<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">سوق السيارات المميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent: #f97316;
            --accent-gradient: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            background-image: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 50%);
            margin: 0; 
            padding: 16px; 
            color: var(--text-main); 
            min-height: 100vh;
        }

        .container { max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
        
        header { 
            text-align: center; 
            margin-bottom: 25px; 
            padding: 20px 15px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        header h1 { 
            color: #ffffff; 
            font-size: 24px; 
            margin: 0 0 12px 0; 
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .btn-admin { 
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0; 
            padding: 8px 18px; 
            border-radius: 30px; 
            font-size: 13px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-admin:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }

        /* لوحة تحكم الأدمن */
        .admin-section { 
            display: none; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            margin-bottom: 25px; 
            border: 1px solid rgba(99, 102, 241, 0.3);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-section h3 { margin-top: 0; font-size: 17px; color: #f1f5f9; margin-bottom: 15px; font-weight: 700; border-right: 4px solid var(--primary); padding-right: 8px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: var(--text-muted); }
        
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 14px; 
            background-color: #0f172a; 
            color: white;
            outline: none; 
            transition: all 0.2s;
        }
        
        .form-group input:focus, .form-group textarea:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); 
        }

        .form-group input[type="file"] {
            padding: 8px;
            background: #0f172a;
            cursor: pointer;
        }
        
        button { cursor: pointer; border: none; font-weight: 700; border-radius: 12px; font-family: 'Cairo', sans-serif; }
        
        .btn-add { 
            background: var(--primary-gradient); 
            color: white; 
            width: 100%; 
            padding: 12px; 
            font-size: 15px; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: opacity 0.2s;
        }
        .btn-add:active { opacity: 0.85; }

        .settings-box { background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        
        /* تصميم كروت المنشورات */
        .listings-grid { display: flex; flex-direction: column; gap: 18px; }
        
        .post-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: transform 0.2s;
        }
        
        .post-img-container { position: relative; width: 100%; height: 210px; }
        .post-img { width: 100%; height: 100%; object-fit: cover; }
        
        .post-body { padding: 18px; }
        
        .post-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: #ffffff; }
        .post-price { color: #34d399; font-size: 17px; font-weight: 800; margin-bottom: 8px; display: inline-block; }
        .post-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.6; }
        
        .btn-unlock { 
            background: var(--accent-gradient); 
            color: white; 
            width: 100%; 
            padding: 13px; 
            border-radius: 14px; 
            font-size: 14px; 
            text-align: center; 
            display: block; 
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.35); 
            font-weight: 700;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-unlock:active { transform: scale(0.98); opacity: 0.9; }
        
        .btn-delete { 
            background: rgba(239, 68, 68, 0.15); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-top: 10px; 
            width: 100%; 
            padding: 10px; 
            font-size: 13px; 
            border-radius: 10px;
        }
        .btn-delete:active { background: rgba(239, 68, 68, 0.3); }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="siteTitleDisplay">سوق السيارات المميز</h1>
        <button class="btn-admin" onclick="loginAdmin()">⚙️ لوحة الأدمن</button>
    </header>

    <!-- لوحة تحكم الأدمن -->
    <div id="adminPanel" class="admin-section">
        <h3>لوحة التحكم والإدارة</h3>
        
        <!-- إعدادات اسم الموقع -->
        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>تعديل اسم الموقع:</label>
                <input type="text" id="newSiteTitleInput" placeholder="أدخل اسم الموقع الجديد">
            </div>
            <button class="btn-add" style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); padding: 10px; font-size: 13px;" onclick="updateSiteTitle()">حفظ الاسم الجديد</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

        <h3>إضافة سيارة جديدة</h3>
        <div class="form-group"><label>عنوان المنشور:</label><input type="text" id="pTitle" placeholder="مثال: تويوتا كامري 2023"></div>
        <div class="form-group"><label>السعر:</label><input type="text" id="pPrice" placeholder="مثال: 15,000 $"></div>
        <div class="form-group"><label>التفاصيل:</label><textarea id="pDesc" placeholder="اكتب تفاصيل السيارة ومواصفاتها..."></textarea></div>
        <div class="form-group"><label>صورة السيارة:</label><input type="file" id="pImage" accept="image/*"></div>
        <button class="btn-add" onclick="addPost()">نشر الإعلان الآن</button>
    </div>

    <!-- عرض المنشورات -->
    <div id="listings" class="listings-grid"></div>
</div>

<script>
    let posts = JSON.parse(localStorage.getItem('myPosts')) || [];
    let isAdmin = false;

    // تحميل اسم الموقع المحفوظ مسبقاً
    function loadSiteTitle() {
        const savedTitle = localStorage.getItem('customSiteTitle') || "سوق السيارات المميز";
        document.title = savedTitle;
        const siteTitleDisplay = document.getElementById('siteTitleDisplay');
        if (siteTitleDisplay) siteTitleDisplay.innerText = savedTitle;
        const newSiteTitleInput = document.getElementById('newSiteTitleInput');
        if (newSiteTitleInput) newSiteTitleInput.value = savedTitle;
    }

    // تحديث اسم الموقع وتخزينه
    function updateSiteTitle() {
        const newTitle = document.getElementById('newSiteTitleInput').value.trim();
        if (newTitle) {
            localStorage.setItem('customSiteTitle', newTitle);
            document.getElementById('siteTitleDisplay').innerText = newTitle;
            document.title = newTitle;
            alert("تم تحديث اسم الموقع بنجاح!");
        } else {
            alert("الرجاء إدخال اسم صحيح.");
        }
    }

    // تسجيل دخول الأدمن
    function loginAdmin() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة سر الأدمن:");
            if (pass === "@oday1996oday@") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                alert("تم تسجيل الدخول بنجاح!");
                renderPosts();
            } else {
                alert("كلمة السر غير صحيحة");
            }
        }
    }

    // إضافة منشور جديد
    function addPost() {
        const title = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const file = document.getElementById('pImage').files[0];

        if (!title || !file) { alert("يرجى إدخال عنوان الإعلان واختيار صورة!"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            const newPost = {
                id: Date.now(),
                title, price, desc,
                image: e.target.result
            };
            posts.push(newPost);
            localStorage.setItem('myPosts', JSON.stringify(posts));
            renderPosts();
            
            document.getElementById('pTitle').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('pImage').value = '';
            alert("تم إضافة الإعلان بنجاح!");
        };
        reader.readAsDataURL(file);
    }

    // حذف منشور
    function deletePost(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنشور؟")) {
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('myPosts', JSON.stringify(posts));
            renderPosts();
        }
    }

    // عرض المنشورات
    function renderPosts() {
        const listDiv = document.getElementById('listings');
        listDiv.innerHTML = '';
        
        if (posts.length === 0) {
            listDiv.innerHTML = '<div class="empty-state">🚗 لا توجد سيارات معروضة حالياً.</div>';
            return;
        }

        posts.forEach(post => {
            listDiv.innerHTML += `
                <div class="post-card">
                    <div class="post-img-container">
                        <img src="${post.image}" class="post-img">
                    </div>
                    <div class="post-body">
                        <div class="post-title">${post.title}</div>
                        <div class="post-price">${post.price}</div>
                        <p class="post-desc">${post.desc || ''}</p>
                        
                        <a href="https://aa1122ppwo.github.io/ssdsa/" target="_blank" class="btn-unlock">📞 اضغط لإظهار رقم التواصل (5$)</a>

                        ${isAdmin ? `<button class="btn-delete" onclick="deletePost(${post.id})">حذف المنشور</button>` : ''}
                    </div>
                </div>
            `;
        });
    }

    // تشغيل التهيئة الأساسية
    loadSiteTitle();
    renderPosts();
</script>

</body>
</html>
